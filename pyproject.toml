[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-window-lost-in-middle-rebalancer"
version = "0.1.0"
description = "Semantic re-ordering pipeline placing highest-priority reference documents at the prompt extremities for maximum attention capture"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
context-window-lost-in-middle-rebalancer = "context_window_lost_in_middle_rebalancer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["context_window_lost_in_middle_rebalancer*"]
